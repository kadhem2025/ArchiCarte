<div class="box"></div>
<h3>Recherche d'un dossier</h3>
<form>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="inputEmail4">Type dossier</label>
        <select id="inputTypeDossier" class="form-control" name="typeDossier" [(ngModel)]="typeDossier">
            <option selected></option>
            <option>Police</option>
            <option>Sinistre</option>
            <option>Cxp</option>
          </select>
      </div>
      
    </div>
   
    <div class="form-group">
      <label for="inputAddress">N° dossier</label>
      <input type="text" class="form-control" id="inputN_dossier"  placeholder="1234567891" name="NumDossier" [(ngModel)]="NumDossier" (input)="checkCategorie()">
    </div>
    
    
   
    <button type="submit"  class="btn btn-primary" (click)="rechercheDossier()" >Rechercher</button>
  </form>
