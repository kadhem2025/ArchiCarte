<div class="box"></div>
<h3>Réservation des dossiers </h3>
<form>
    <div class="form-group">
      <label for="inputAddress">N° dossier</label>
      <input type="text" class="form-control" id="inputN_dossier" placeholder="1234567891" name="Ndossier" [(ngModel)]="Ndossier">
    </div>

    <div class="form-group ">
        <label for="reserverPar">Réserver par</label>
        <input type="text" class="form-control" id="reserverPar" placeholder="name" name="NamePersonnel" (focus)="getNames()" list="suggestionsNom" [(ngModel)]="NamePersonnel">

        <datalist id="suggestionsNom">
          <option *ngFor="let suggestion of suggestionsNom" [value]="suggestion"></option>
        </datalist>
      </div>
      <div class="form-row">
      <div class="form-group col-md-6">
        <label for="inputAddress">Date réservation</label>
        <input type="date" class="form-control" id="dateRes" placeholder="01/01/2000" name="dateRes" [(ngModel)]="dateRes">
      </div>

      <div class="form-group col-md-6">
        <label for="inputAddress">Date retour</label>
        <input type="date" class="form-control" id="dateRet" placeholder="01/01/2000" name="dateRet" [(ngModel)]="dateRet">
      </div>
      </div>
      
   
    <button type="submit" routerLink="gridD" class="btn btn-primary" >Enregistrer</button>
  </form>
