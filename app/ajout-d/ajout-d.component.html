<div class="box"></div>
<h3>Ajouter dossier</h3>
<form>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="inputEmail4">Type dossier</label>
        <select id="inputTypeDossier" class="form-control" name="typeDossier"  [(ngModel)]="typeDossier">
            <option selected ></option>
            <option>Police</option>
            <option>Sinistre</option>
            <option>Cxp</option>
          </select>
      </div>
      
    </div>
    <div class="form-group">
      <label for="inputAddress">N° dossier</label>
      <textarea type="text" class="form-control" id="inputN_dossier" name="inputN_dossier" [(ngModel)]="inputN_dossier" placeholder="1234567891"></textarea>
    </div>
    
    
   
    <button type="submit" class="btn btn-primary" (click)="AjoutListDossiers()">Ajout</button>
  </form>
