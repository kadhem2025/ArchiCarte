<!DOCTYPE html>
<html>
<head>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" >ArchiCarte</a>
      <img src="assets/new_logo.png" alt="Description of Image" width="40" height="40">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <button><a class="nav-link active" aria-current="page" (click)="accueil()" >Accueil</a></button>
            
          </li>
          <li class="nav-item">
            <button><a class="nav-link active" aria-current="page" (click)="changeStatus()" >{{status}}</a></button>
            
          </li>
          <li class="nav-item" *ngIf="status=='Déconnexion'">
            <button><a class="nav-link active" aria-current="page" routerLink="Dossier/statistique" >Statistiques</a></button>
            
          </li>

        </ul>
        <form class="d-flex">
          <button class="btn btn-outline-success" type="submit">{{name}}</button>
        </form>
      </div>
    </div>
  </nav>
</body>
</html>
