<div class="box"></div>
<h3>Consulter Personnels</h3>
<form>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="inputEmail4">Nom</label>
        <input type="email" class="form-control" id="inputNom" name="firstName" [(ngModel)]="userData.firstName" placeholder="Nom">
      </div>
      <div class="form-group col-md-6">
        <label for="inputPassword4">Prénom</label>
        <input type="text" class="form-control" id="inputPrenom" name="lastName" [(ngModel)]="userData.lastName" placeholder="Prénom">
      </div>
    </div>
    <div class="form-group">
      <label for="inputpassword">Email</label>
      <input type="email" class="form-control" id="inputpassword" name="email"  [(ngModel)]="userData.email" placeholder="Email">
    </div>
    <div class="form-group">
      <label for="inputAddress">Nom d'utilisateur</label>
      <input type="text" class="form-control" id="inputAddress" name="username" [(ngModel)]="userData.username" placeholder="Login" >
    </div>
    <div class="form-group">
      <label for="inputAddress">Mot de passe</label>
      <input type="text" class="form-control" id="inputAddress" name="password" [(ngModel)]="userData.password" placeholder="Mot de passe">
    </div>
    
    <div class="form-group">
      <label for="inputAddress">Profil</label>
      <input type="text" class="form-control" id="inputAddress" name="profile" [(ngModel)]="userData.profil" placeholder="Profil">
    </div>
      <div class="form-row">
      <button type="button" class="btn btn-danger" (click)="deleteUser()">Supprimer</button>
    <button type="submit" class="btn btn-primary" (click)="updateUser()">Modifier</button>
  </div>
  </form>
